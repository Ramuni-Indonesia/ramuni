name: Quality and SEO

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  ASTRO_TELEMETRY_DISABLED: '1'
  PUBLIC_DEPLOY_ENV: production
  PUBLIC_INDEXING_ENABLED: 'true'
  PUBLIC_SITE_URL: https://ramuni.id

jobs:
  repository-guard:
    name: Repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed credentials
        shell: bash
        run: |
          if git grep -I -n -E '(ghp_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{50,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!package-lock.json'; then
            echo 'Potential credential material is committed. Remove and rotate it before publication.' >&2
            exit 1
          fi
      - name: Check branch hygiene
        shell: bash
        run: |
          git status --short
          test -f README.md
          test -f .env.example
          test -f scripts/site-audit.mjs

  static-quality:
    name: Build, SEO, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repository-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # The explicit WASI fallback packages declare cpu=wasm32; --force keeps
      # the locked local WASI path installable on standard x64 CI runners.
      - name: Install locked dependencies
        run: npm ci --force
      - name: Type and Astro check
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Static SEO and accessibility audit
        run: npm run audit
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Summarize static output
        shell: bash
        run: |
          page_count=$(find dist -name '*.html' | wc -l | tr -d ' ')
          dist_size=$(du -sh dist | cut -f1)
          {
            echo '## RAMUNI quality summary'
            echo
            echo "- HTML pages: ${page_count}"
            echo "- Static output size: ${dist_size}"
            echo '- Checks: Astro check, production build, custom SEO/accessibility audit, npm high vulnerability audit'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reviewed static output
        uses: actions/upload-artifact@v7
        with:
          name: ramuni-static-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
