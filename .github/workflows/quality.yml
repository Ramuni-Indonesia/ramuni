name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-quality:
    name: Astro production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PUBLIC_DEPLOY_ENV: production
      PUBLIC_INDEXING_ENABLED: 'true'
      PUBLIC_SITE_URL: https://ramuni.id
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed credentials
        shell: bash
        run: |
          if git grep -I -n -E '(ghp_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{50,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!package-lock.json'; then
            echo 'Potential credential material is committed. Remove and rotate it before publication.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The explicit WASI fallback packages declare cpu=wasm32; --force keeps
      # the locked local WASI path installable on standard x64 CI runners.
      - run: npm ci --force
      - run: npm run check
      - run: npm run build
      - run: npm run audit
      - run: npm audit --audit-level=high
      - name: Upload reviewed static output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ramuni-static-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
