server {
  listen 80;
  listen [::]:80;
  server_name www.ramuni.id;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://www.ramuni.id$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.ramuni.id;

  root /var/www/ramuni-staging/current;
  index index.html;
  ssl_certificate /etc/letsencrypt/live/ramuni.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ramuni.id/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  access_log /var/log/nginx/ramuni-production.access.log;
  error_log /var/log/nginx/ramuni-production.error.log warn;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  include /etc/nginx/snippets/ramuni-production-security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain text/xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/ramuni-production-security-headers.conf;
    try_files /RELEASE =503;
  }

  # Static Astro redirects render a noindex meta-refresh document. Use HTTP
  # redirects here so retired aliases have one canonical destination.
  location ~ ^/(demo|early-access|harga)/?$ { return 301 /tour-produk-gratis/; }
  location = /penulis { return 301 /blog/penulis/; }
  location = /penulis/ { return 301 /blog/penulis/; }
  location = /blog/penulis { return 301 /blog/penulis/; }
  location ~ ^/blog/penulis/tim-editorial-ramuni/?$ { return 301 /blog/penulis/; }
  location ~ ^/blog/penulis/desk-keuangan-ramuni/?$ { return 301 /blog/penulis/alya-pramesti/; }
  location ~ ^/blog/penulis/desk-operasional-ramuni/?$ { return 301 /blog/penulis/bima-ardiansyah/; }
  location ~ ^/blog/penulis/desk-pelanggan-ramuni/?$ { return 301 /blog/penulis/citra-maheswari/; }
  location ~ ^/blog/penulis/desk-strategi-industri-ramuni/?$ { return 301 /blog/penulis/dimas-wicaksana/; }

  location = /api/cms/revalidate {
    proxy_pass http://127.0.0.1:4330/api/cms/revalidate;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Content-Type $content_type;
    proxy_set_header X-Ramuni-Timestamp $http_x_ramuni_timestamp;
    proxy_set_header X-Ramuni-Signature $http_x_ramuni_signature;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/ramuni-production-security-headers.conf;
  }

  location ^~ /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Vary "Accept-Encoding" always;
    include /etc/nginx/snippets/ramuni-production-security-headers.conf;
  }

  location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000, stale-if-error=86400" always;
    add_header Vary "Accept-Encoding" always;
    include /etc/nginx/snippets/ramuni-production-security-headers.conf;
  }

  location ~ /\.(?!well-known/) { access_log off; log_not_found off; return 404; }
  error_page 404 /404.html;
  error_page 500 502 503 504 /500.html;
  location = /404.html { internal; add_header Cache-Control "no-store" always; include /etc/nginx/snippets/ramuni-production-security-headers.conf; }
  location = /500.html { internal; add_header Cache-Control "no-store" always; include /etc/nginx/snippets/ramuni-production-security-headers.conf; }
  location / { try_files $uri $uri/ $uri.html =404; add_header Cache-Control "no-store" always; include /etc/nginx/snippets/ramuni-production-security-headers.conf; }
}
