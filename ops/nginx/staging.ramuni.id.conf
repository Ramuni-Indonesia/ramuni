server {
    listen 80;
    listen [::]:80;
    server_name staging.ramuni.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://staging.ramuni.id$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.ramuni.id;

    root /var/www/ramuni-staging/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/staging.ramuni.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.ramuni.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ramuni-staging.access.log;
    error_log /var/log/nginx/ramuni-staging.error.log warn;

    include /etc/nginx/snippets/ramuni-staging-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Astro fingerprints these assets, so they are safe to retain across releases.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
    }

    # Public filenames are not content-hashed. Keep their TTL short on staging.
    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
    }

    location ~ /\.(?!well-known/) {
        access_log off;
        log_not_found off;
        return 404;
    }

    error_page 404 /404/index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
    }
}
