server {
    listen 80;
    listen [::]:80;
    server_name staging.ramuni.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://staging.ramuni.id$request_uri;
    }
}

server {
    # Ubuntu's Nginx 1.24 enables HTTP/2 on the listen socket. The newer
    # `http2 on` directive is only available from Nginx 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.ramuni.id;

    root /var/www/ramuni-staging/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/staging.ramuni.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.ramuni.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ramuni-staging.access.log;
    error_log /var/log/nginx/ramuni-staging.error.log warn;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    # Do not enable open_file_cache on a document root that changes through an
    # atomic symlink. Cached file descriptors can keep serving the old release
    # after `current` moves. The kernel page cache still covers file contents.
    open_file_cache off;

    include /etc/nginx/snippets/ramuni-staging-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_static on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # The staging host ships Ubuntu's dynamic Brotli filter/static modules.
    # Deployment precompresses text assets so requests avoid recompression.
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain text/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
        try_files /RELEASE =503;
    }

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # Never expose a sitemap from staging, including a stale artifact left by
    # an older build. Crawlers may fetch pages only to observe their noindex.
    location ~ ^/sitemap(?:-index)?(?:-[^/]*)?\.xml$ {
        access_log off;
        log_not_found off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
        return 404;
    }

    # Astro fingerprints these assets, so they are safe to retain across releases.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
    }

    # Public filenames are not content-hashed. Keep their TTL short on staging.
    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000, stale-if-error=86400" always;
        add_header Vary "Accept-Encoding" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
    }

    location ~ /\.(?!well-known/) {
        access_log off;
        log_not_found off;
        return 404;
    }

    error_page 404 /404/index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ramuni-staging-security-headers.conf;
    }
}
