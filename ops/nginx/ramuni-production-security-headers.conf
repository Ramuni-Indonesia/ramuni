add_header X-Content-Type-Options "nosniff" always;
add_header X-Robots-Tag $ramuni_robots_tag always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://crm.ramuni.id; font-src 'self' https://assets-staging.ramuni.id; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https://assets-staging.ramuni.id; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
